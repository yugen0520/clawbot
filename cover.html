<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px;
    background: linear-gradient(135deg, #0a0e27 0%, #1a1040 40%, #0d1b2a 100%);
    display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, sans-serif;
    position: relative; overflow: hidden;
  }
  .grid { position: absolute; width: 100%; height: 100%;
    background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .glow1 { position: absolute; width: 500px; height: 500px; border-radius: 50%;
    background: radial-gradient(circle, rgba(99,102,241,0.15), transparent 70%);
    top: -100px; right: -100px; }
  .glow2 { position: absolute; width: 400px; height: 400px; border-radius: 50%;
    background: radial-gradient(circle, rgba(34,211,238,0.1), transparent 70%);
    bottom: -100px; left: -50px; }
  .content { position: relative; z-index: 1; text-align: center; padding: 40px; }
  h1 { font-size: 72px; font-weight: 800; color: #fff; letter-spacing: -1px;
    background: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #22d3ee 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; margin-bottom: 16px; }
  .subtitle { font-size: 24px; color: #94a3b8; font-weight: 400; margin-bottom: 32px;
    max-width: 700px; margin-left: auto; margin-right: auto; line-height: 1.5; }
  .badges { display: flex; gap: 16px; justify-content: center; margin-bottom: 40px; }
  .badge { padding: 8px 20px; border-radius: 20px; font-size: 14px; font-weight: 600;
    border: 1px solid rgba(255,255,255,0.15); color: #cbd5e1; }
  .badge.primary { background: rgba(99,102,241,0.2); border-color: rgba(99,102,241,0.4);
    color: #a5b4fc; }
  .footer { font-size: 14px; color: #64748b; display: flex; gap: 32px;
    justify-content: center; align-items: center; }
  .footer span { display: flex; align-items: center; gap: 8px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #22d3ee; }
</style>
</head>
<body>
<div class="grid"></div>
<div class="glow1"></div>
<div class="glow2"></div>
<div class="content">
  <h1>ClawBot</h1>
  <p class="subtitle">AI DeFi Butler — Natural language to verifiable on-chain execution on Mantle Network</p>
  <div class="badges">
    <span class="badge primary">Mantle Sepolia</span>
    <span class="badge">9 Smart Contracts</span>
    <span class="badge">DeepSeek AI</span>
    <span class="badge">Telegram Bot</span>
  </div>
  <div class="footer">
    <span><span class="dot"></span> Mantle Turing Test Hackathon 2026</span>
    <span>Agentic Economy Track</span>
  </div>
</div>
</body>
</html>
